<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptNote</title>
    <style>
      :root { font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #17352b; background: #f5f7f4; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(520px, calc(100vw - 64px)); padding: 32px; border: 1px solid #d7ded9; border-radius: 16px; background: #fff; box-shadow: 0 18px 50px rgba(23, 53, 43, 0.08); }
      strong { display: block; font-size: 22px; margin-bottom: 10px; }
      p { margin: 0; color: #5b6d65; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main data-promptnote-desktop-host="p2">
      <strong>PromptNote Desktop Host</strong>
      <p>Windows Desktop 宿主已启动。共享编辑应用将在 Desktop Repository 与 SecretStore 接入后挂载到此窗口。</p>
    </main>
  </body>
</html>
