[package]
name = "promptnote-desktop"
version = "0.1.0"
description = "PromptNote Windows Desktop host"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-http = "=2.5.9"
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "=1.0.0"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
