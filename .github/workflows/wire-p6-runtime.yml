name: wire-p6-runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-p6-runtime.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Wire startup runtime and remove stale host settings branch
        shell: python
        run: |
          from pathlib import Path

          shell_path = Path('src-tauri/src/shell.rs')
          shell = shell_path.read_text(encoding='utf-8')
          shell = shell.replace(
              '    pub fn initialize(&self, app: &AppHandle) -> Result<(), String> {\n        self.ensure_orb_window(app)?;\n        self.install_tray(app)?;\n',
              '    pub fn initialize(&self, app: &AppHandle, background_launch: bool) -> Result<(), String> {\n        self.ensure_orb_window(app)?;\n        self.install_tray(app)?;\n\n        if background_launch {\n            return self.show_background_launch(app);\n        }\n',
              1,
          )
          orb_anchor = '            .transparent(true)\n            .always_on_top(true)'
          assert shell.count(orb_anchor) == 1
          shell = shell.replace(
              orb_anchor,
              '            .transparent(true)\n            .focusable(false)\n            .focused(false)\n            .always_on_top(true)',
              1,
          )
          background_anchor = '    fn show_orb_or_tray(&self, app: &AppHandle) -> Result<(), String> {'
          assert shell.count(background_anchor) == 1
          background = '''    fn show_background_launch(&self, app: &AppHandle) -> Result<(), String> {
              hide_window(app, MAIN_LABEL)?;
              let preferences = self.lock_preferences()?.clone();
              if preferences.orb_enabled {
                  *self.lock_mode()? = ShellMode::Orb;
                  let orb = orb_window(app)?;
                  if crate::fullscreen::is_suppressed() {
                      hide_window(app, ORB_LABEL)?;
                  } else {
                      let monitor = select_monitor(&orb, preferences.monitor_name.as_deref())?;
                      self.position_orb(&orb, &monitor, false)?;
                      orb.show().map_err(error_message)?;
                  }
              } else {
                  *self.lock_mode()? = ShellMode::TrayBackground;
                  hide_window(app, ORB_LABEL)?;
              }
              self.emit_snapshot(app)
          }

          '''
          shell = shell.replace(background_anchor, background + background_anchor, 1)

          old_position = '''            if let Some(position) = bounds.position {
                  main.set_position(position).map_err(error_message)?;
              } else {
                  main.center().map_err(error_message)?;
              }'''
          new_position = '''            if let Some(position) = bounds.position {
                  if saved_bounds_visible(&main, position, bounds.size)? {
                      main.set_position(position).map_err(error_message)?;
                  } else {
                      main.center().map_err(error_message)?;
                  }
              } else {
                  main.center().map_err(error_message)?;
              }'''
          assert shell.count(old_position) == 1
          shell = shell.replace(old_position, new_position, 1)

          helper_anchor = 'fn logical_to_physical(value: f64, scale: f64) -> u32 {'
          assert shell.count(helper_anchor) == 1
          helper = '''fn saved_bounds_visible(
              window: &WebviewWindow,
              position: PhysicalPosition<i32>,
              size: PhysicalSize<u32>,
          ) -> Result<bool, String> {
              let monitors = window.available_monitors().map_err(error_message)?;
              Ok(monitors.iter().any(|monitor| {
                  let work = monitor.work_area();
                  rectangles_have_safe_overlap(position, size, work.position, work.size)
              }))
          }

          fn rectangles_have_safe_overlap(
              position: PhysicalPosition<i32>,
              size: PhysicalSize<u32>,
              work_position: PhysicalPosition<i32>,
              work_size: PhysicalSize<u32>,
          ) -> bool {
              let left = position.x.max(work_position.x);
              let top = position.y.max(work_position.y);
              let right = (position.x + size.width as i32)
                  .min(work_position.x + work_size.width as i32);
              let bottom = (position.y + size.height as i32)
                  .min(work_position.y + work_size.height as i32);
              let visible_width = right.saturating_sub(left) as u32;
              let visible_height = bottom.saturating_sub(top) as u32;
              visible_width >= 64.min(size.width) && visible_height >= 48.min(size.height)
          }

          '''
          shell = shell.replace(helper_anchor, helper + helper_anchor, 1)

          test_anchor = '    #[test]\n    fn logical_sizes_scale_for_high_dpi() {'
          assert shell.count(test_anchor) == 1
          new_test = '''    #[test]
              fn offscreen_window_bounds_require_safe_visible_area() {
                  let size = PhysicalSize::new(1080, 720);
                  let work_position = PhysicalPosition::new(0, 0);
                  let work_size = PhysicalSize::new(1920, 1080);
                  assert!(rectangles_have_safe_overlap(
                      PhysicalPosition::new(100, 100),
                      size,
                      work_position,
                      work_size,
                  ));
                  assert!(!rectangles_have_safe_overlap(
                      PhysicalPosition::new(1910, 1070),
                      size,
                      work_position,
                      work_size,
                  ));
                  assert!(!rectangles_have_safe_overlap(
                      PhysicalPosition::new(-2000, 0),
                      size,
                      work_position,
                      work_size,
                  ));
              }

              '''
          shell = shell.replace(test_anchor, new_test + test_anchor, 1)
          shell_path.write_text(shell, encoding='utf-8')

          lib_path = Path('src-tauri/src/lib.rs')
          lib = lib_path.read_text(encoding='utf-8')
          lib = lib.replace('mod shell;\nmod storage;', 'mod shell;\nmod startup;\nmod storage;', 1)
          lib = lib.replace(
              'use shell::{ShellController, ShellSnapshot};\nuse storage::PromptDocument;',
              'use shell::{ShellController, ShellSnapshot};\nuse startup::{StartupSnapshot, StartupState};\nuse storage::PromptDocument;',
              1,
          )
          command_anchor = '#[cfg_attr(mobile, tauri::mobile_entry_point)]\npub fn run() {'
          assert lib.count(command_anchor) == 1
          commands = '''#[tauri::command]
          fn startup_snapshot(
              app: tauri::AppHandle,
              state: tauri::State<'_, StartupState>,
          ) -> Result<StartupSnapshot, String> {
              startup::snapshot(&app, &state)
          }

          #[tauri::command]
          fn startup_set_autostart(app: tauri::AppHandle, enabled: bool) -> Result<bool, String> {
              startup::set_autostart(&app, enabled)
          }

          '''
          lib = lib.replace(command_anchor, commands + command_anchor, 1)
          plugin_anchor = '        .plugin(tauri_plugin_http::init())\n        .setup(|app| {'
          assert lib.count(plugin_anchor) == 1
          plugins = '''        .plugin(
              tauri_plugin_global_shortcut::Builder::new()
                  .with_handler(|app, shortcut, event| {
                      if event.state() == tauri_plugin_global_shortcut::ShortcutState::Pressed
                          && shortcut == &startup::promptnote_shortcut()
                      {
                          if let Some(shell) = app.try_state::<ShellController>() {
                              if let Err(error) = shell.toggle_compact(app) {
                                  eprintln!("PromptNote global shortcut failed: {error}");
                              }
                          }
                      }
                  })
                  .build(),
          )
          .plugin(tauri_plugin_autostart::init(
              tauri_plugin_autostart::MacosLauncher::LaunchAgent,
              Some(vec![startup::AUTOSTART_ARG]),
          ))
          .plugin(tauri_plugin_http::init())
          .setup(|app| {'''
          lib = lib.replace(plugin_anchor, plugins, 1)
          manage_anchor = '''            app.manage(shell);
              app.state::<ShellController>()
                  .initialize(app.handle())
                  .map_err(std::io::Error::other)?;'''
          assert lib.count(manage_anchor) == 1
          manage = '''            app.manage(shell);
              let startup_state = startup::register_global_shortcut(app.handle());
              app.manage(startup_state);
              let background_launch = startup::launched_from_autostart();
              app.state::<ShellController>()
                  .initialize(app.handle(), background_launch)
                  .map_err(std::io::Error::other)?;'''
          lib = lib.replace(manage_anchor, manage, 1)
          handler_anchor = '            shell_set_orb_idle,\n        ])'
          assert lib.count(handler_anchor) == 1
          lib = lib.replace(
              handler_anchor,
              '            shell_set_orb_idle,\n            startup_snapshot,\n            startup_set_autostart,\n        ])',
              1,
          )
          lib_path.write_text(lib, encoding='utf-8')

          app_path = Path('src/app/PromptNoteApp.tsx')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace("  command: 'new-prompt' | 'settings'", "  command: 'new-prompt'", 1)
          effect_start = app.index('  useEffect(() => {\n', app.index('lastHostCommandIdRef'))
          preview_anchor = app.index('  const previewText = useMemo(', effect_start)
          replacement_effect = '''  useEffect(() => {
              if (!hostCommand || lastHostCommandIdRef.current === hostCommand.id) return
              lastHostCommandIdRef.current = hostCommand.id
              void createDocument()
            }, [hostCommand])

          '''
          app = app[:effect_start] + replacement_effect + app[preview_anchor:]
          app = app.replace(
              "  function openAi(clearSelection = true, panel?: 'menu' | 'settings') {",
              '  function openAi(clearSelection = true) {',
              1,
          )
          app = app.replace(
              "    setAiPanel(panel ?? (aiSettings.configured ? 'menu' : 'settings'))",
              "    setAiPanel(aiSettings.configured ? 'menu' : 'settings')",
              1,
          )
          app_path.write_text(app, encoding='utf-8')
      - name: Commit source wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-p6-runtime.yml
          git add src-tauri/src/lib.rs src-tauri/src/shell.rs src/app/PromptNoteApp.tsx
          git commit -m "feat(desktop): wire P6 startup runtime"
          git push origin HEAD:main
