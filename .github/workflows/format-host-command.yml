name: format-host-command

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-host-command.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fix host-command effect formatting
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/PromptNoteApp.tsx')
          text = path.read_text(encoding='utf-8')
          old = """  useEffect(() => {
          if (!hostCommand || lastHostCommandIdRef.current === hostCommand.id) return
          lastHostCommandIdRef.current = hostCommand.id
          if (hostCommand.command === 'new-prompt') {
            void createDocument()
            return
          }
          openAi(true, 'settings')
        }, [hostCommand])"""
          new = """  useEffect(() => {
            if (!hostCommand || lastHostCommandIdRef.current === hostCommand.id) return
            lastHostCommandIdRef.current = hostCommand.id
            if (hostCommand.command === 'new-prompt') {
              void createDocument()
              return
            }
            openAi(true, 'settings')
          }, [hostCommand])"""
          assert old in text, 'host-command effect formatting anchor changed'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-host-command.yml
          git add src/app/PromptNoteApp.tsx
          git commit -m "style(desktop): clean host command effect"
          git push origin HEAD:main
