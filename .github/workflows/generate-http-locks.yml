name: generate-http-locks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-http-locks.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Add exact HTTP plugin dependencies
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact @tauri-apps/plugin-http@2.5.9
          cargo add --manifest-path src-tauri/Cargo.toml tauri-plugin-http@=2.5.9
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit locks and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-http-locks.yml
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "build(desktop): lock HTTP plugin dependencies"
          git push origin HEAD:main
