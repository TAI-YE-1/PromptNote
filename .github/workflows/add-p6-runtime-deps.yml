name: add-p6-runtime-deps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-p6-runtime-deps.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Add exact P6 runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo add --manifest-path src-tauri/Cargo.toml tauri-plugin-global-shortcut@=2.3.2
          cargo add --manifest-path src-tauri/Cargo.toml tauri-plugin-autostart@=2.5.1
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit locks and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-p6-runtime-deps.yml
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "build(desktop): lock P6 runtime plugins"
          git push origin HEAD:main
