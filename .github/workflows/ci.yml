name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependency licenses
        run: npm run license:audit
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Read extension version
        if: github.event_name == 'push'
        id: extension
        shell: bash
        run: |
          version="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("public/manifest.json", "utf8")).version)')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package release artifact
        if: github.event_name == 'push'
        run: |
          cd dist
          zip -qr "../promptnote-${{ steps.extension.outputs.version }}.zip" .
      - name: Upload release artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: promptnote-${{ steps.extension.outputs.version }}
          path: promptnote-${{ steps.extension.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30
