name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependency licenses
        run: npm run license:audit
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Package release artifact
        if: github.event_name == 'push'
        run: |
          cd dist
          zip -qr ../promptnote-1.0.0.zip .
      - name: Upload release artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: promptnote-1.0.0
          path: promptnote-1.0.0.zip
          if-no-files-found: error
          retention-days: 30

  desktop-host:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Build Desktop shell frontend
        run: npm run build:desktop-shell
      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
      - name: Test Windows x64 Desktop host
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Upload generated Cargo lock
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: promptnote-desktop-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
