name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependency licenses
        run: npm run license:audit
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Read extension version
        if: github.event_name == 'push'
        run: echo "EXTENSION_VERSION=$(node -p 'JSON.parse(require(\"node:fs\").readFileSync(\"public/manifest.json\", \"utf8\")).version')" >> "$GITHUB_ENV"
      - name: Package release artifact
        if: github.event_name == 'push'
        run: |
          cd dist
          zip -qr "../promptnote-${EXTENSION_VERSION}.zip" .
      - name: Upload release artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: promptnote-${{ env.EXTENSION_VERSION }}
          path: promptnote-${{ env.EXTENSION_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30
