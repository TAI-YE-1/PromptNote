name: finalize-fullscreen-lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-fullscreen-lock.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Format Rust source
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Build real Desktop frontendDist
        shell: pwsh
        run: npm run build:desktop-shell
      - name: Regenerate locked Windows dependency graph
        shell: pwsh
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Test Windows x64 Desktop host
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Commit validated lock and formatting
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-fullscreen-lock.yml
          git add src-tauri/Cargo.lock src-tauri/src/lib.rs src-tauri/src/shell.rs src-tauri/src/fullscreen.rs
          git commit -m "test(desktop): validate fullscreen shell runtime"
          git push origin HEAD:main
