name: slash-runtime-finalizer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/slash-runtime-finalizer.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply fix
        run: python .github/scripts/fix_slash_runtime.py

      - name: Normalize boundary test
        shell: bash
        run: |
          cat > tests/slash-menu-runtime-boundary.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest'
          import editorSource from '../src/editor/PromptEditor.tsx?raw'
          import menuSource from '../src/ui/SlashMenu.tsx?raw'

          describe('slash menu runtime boundary', () => {
            it('anchors from ProseMirror coordinates at slash key time', () => {
              expect(editorSource).toContain('view.coordsAtPos(view.state.selection.from)')
              expect(editorSource).toContain('onSlashRequestRef.current')
            })

            it('keeps keyboard ownership in PromptEditor instead of the React menu', () => {
              expect(editorSource).toContain('onSlashMenuKeyRef.current')
              expect(menuSource).not.toContain('window.getSelection')
              expect(menuSource).not.toContain("addEventListener('keydown'")
            })
          })
          EOF

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify branch head
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Commit validated fix
        run: |
          rm .github/workflows/slash-runtime-finalizer.yml
          rm .github/scripts/fix_slash_runtime.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): anchor slash menu to ProseMirror caret"
          git push origin HEAD:main
