name: generate-desktop-cargo-lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-desktop-cargo-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Generate exact Cargo lock
        shell: pwsh
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-desktop-cargo-lock.yml
          git add src-tauri/Cargo.lock
          git commit -m "build(desktop): lock Rust dependencies"
          git push origin HEAD:main
