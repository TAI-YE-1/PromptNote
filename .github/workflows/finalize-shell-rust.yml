name: finalize-shell-rust

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-shell-rust.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Apply narrow source fixes
        shell: pwsh
        run: |
          $path = 'src-tauri/src/shell.rs'
          $text = [System.IO.File]::ReadAllText($path)
          $replacements = @(
            @('use tauri::webview::{WebviewUrl, WebviewWindow, WebviewWindowBuilder};', 'use tauri::webview::{WebviewWindow, WebviewWindowBuilder};'),
            @('use tauri::window::{Monitor, PhysicalPosition, PhysicalSize};', 'use tauri::window::Monitor;'),
            @('use tauri::{AppHandle, Emitter, Manager};', 'use tauri::{AppHandle, Emitter, Manager, PhysicalPosition, PhysicalSize, WebviewUrl};'),
            @('        let preferences = storage::load_shell_preferences(&database_path)?', '        let preferences: ShellPreferences = storage::load_shell_preferences(&database_path)?')
          )
          foreach ($pair in $replacements) {
            $count = ([regex]::Matches($text, [regex]::Escape($pair[0]))).Count
            if ($count -ne 1) { throw "shell.rs anchor count $count for: $($pair[0])" }
            $text = $text.Replace($pair[0], $pair[1])
          }
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

          $appPath = 'src/app/PromptNoteApp.tsx'
          $app = [System.IO.File]::ReadAllText($appPath)
          $bad = @'
  useEffect(() => {
  if (!hostCommand || lastHostCommandIdRef.current === hostCommand.id) return
  lastHostCommandIdRef.current = hostCommand.id
  if (hostCommand.command === 'new-prompt') {
    void createDocument()
    return
  }
  openAi(true, 'settings')
}, [hostCommand])
'@
          $good = @'
  useEffect(() => {
    if (!hostCommand || lastHostCommandIdRef.current === hostCommand.id) return
    lastHostCommandIdRef.current = hostCommand.id
    if (hostCommand.command === 'new-prompt') {
      void createDocument()
      return
    }
    openAi(true, 'settings')
  }, [hostCommand])
'@
          if (-not $app.Contains($bad)) { throw 'PromptNoteApp host-command formatting anchor changed' }
          $app = $app.Replace($bad, $good)
          [System.IO.File]::WriteAllText($appPath, $app, [System.Text.UTF8Encoding]::new($false))
      - name: Verify frontend and produce Tauri frontendDist
        shell: pwsh
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build:desktop-shell
      - name: Regenerate locked tray dependency graph
        shell: pwsh
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Check Windows x64 Desktop host against built frontend
        shell: pwsh
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Commit validated shell fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-shell-rust.yml
          git add src-tauri/src/shell.rs src-tauri/Cargo.lock src/app/PromptNoteApp.tsx
          git commit -m "fix(desktop): validate shell runtime boundary"
          git push origin HEAD:main
