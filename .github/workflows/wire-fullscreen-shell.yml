name: wire-fullscreen-shell

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-fullscreen-shell.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Wire fullscreen guard into the unique shell controller
        shell: python
        run: |
          from pathlib import Path

          shell_path = Path('src-tauri/src/shell.rs')
          shell = shell_path.read_text(encoding='utf-8')
          old_show = '''    fn show_orb(&self, app: &AppHandle) -> Result<(), String> {
              let orb = orb_window(app)?;
              let preferences = self.lock_preferences()?.clone();
              let monitor = select_monitor(&orb, preferences.monitor_name.as_deref())?;
              self.position_orb(&orb, &monitor, false)?;
              orb.show().map_err(error_message)?;
              self.set_mode_and_persist(ShellMode::Orb)?;
              self.emit_snapshot(app)
          }'''
          new_show = '''    fn show_orb(&self, app: &AppHandle) -> Result<(), String> {
              let orb = orb_window(app)?;
              self.set_mode_and_persist(ShellMode::Orb)?;
              if crate::fullscreen::is_suppressed() {
                  hide_window(app, ORB_LABEL)?;
                  return self.emit_snapshot(app);
              }
              let preferences = self.lock_preferences()?.clone();
              let monitor = select_monitor(&orb, preferences.monitor_name.as_deref())?;
              self.position_orb(&orb, &monitor, false)?;
              orb.show().map_err(error_message)?;
              self.emit_snapshot(app)
          }'''
          assert shell.count(old_show) == 1, 'shell show_orb anchor changed'
          shell_path.write_text(shell.replace(old_show, new_show, 1), encoding='utf-8')

          lib_path = Path('src-tauri/src/lib.rs')
          lib = lib_path.read_text(encoding='utf-8')
          module_anchor = 'mod credentials;\nmod shell;\nmod storage;'
          module_replacement = 'mod credentials;\n#[cfg(target_os = "windows")]\nmod fullscreen;\nmod shell;\nmod storage;'
          assert lib.count(module_anchor) == 1, 'lib module anchor changed'
          lib = lib.replace(module_anchor, module_replacement, 1)

          setup_anchor = '''            app.state::<ShellController>()
                      .initialize(app.handle())
                      .map_err(std::io::Error::other)?;
                  Ok(())'''
          setup_replacement = '''            app.state::<ShellController>()
                      .initialize(app.handle())
                      .map_err(std::io::Error::other)?;
                  #[cfg(target_os = "windows")]
                  fullscreen::start(app.handle().clone()).map_err(std::io::Error::other)?;
                  Ok(())'''
          assert lib.count(setup_anchor) == 1, 'lib setup anchor changed'
          lib_path.write_text(lib.replace(setup_anchor, setup_replacement, 1), encoding='utf-8')
      - name: Commit source wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-fullscreen-shell.yml
          git add src-tauri/src/lib.rs src-tauri/src/shell.rs
          git commit -m "feat(desktop): wire fullscreen Orb suppression"
          git push origin HEAD:main
