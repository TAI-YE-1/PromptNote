name: wire-fullscreen-shell

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-fullscreen-shell.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Wire fullscreen guard into the unique shell controller
        shell: python
        run: |
          from pathlib import Path

          shell_path = Path('src-tauri/src/shell.rs')
          shell = shell_path.read_text(encoding='utf-8')
          start_token = '    fn show_orb(&self, app: &AppHandle) -> Result<(), String> {'
          end_token = '    fn position_orb(&self, orb: &WebviewWindow, monitor: &Monitor, idle: bool) -> Result<(), String> {'
          start = shell.index(start_token)
          end = shell.index(end_token, start)
          replacement = '''    fn show_orb(&self, app: &AppHandle) -> Result<(), String> {
              let orb = orb_window(app)?;
              self.set_mode_and_persist(ShellMode::Orb)?;
              if crate::fullscreen::is_suppressed() {
                  hide_window(app, ORB_LABEL)?;
                  return self.emit_snapshot(app);
              }
              let preferences = self.lock_preferences()?.clone();
              let monitor = select_monitor(&orb, preferences.monitor_name.as_deref())?;
              self.position_orb(&orb, &monitor, false)?;
              orb.show().map_err(error_message)?;
              self.emit_snapshot(app)
          }

          '''
          shell_path.write_text(shell[:start] + replacement + shell[end:], encoding='utf-8')

          lib_path = Path('src-tauri/src/lib.rs')
          lib = lib_path.read_text(encoding='utf-8')
          assert 'mod fullscreen;' not in lib
          lib = lib.replace(
              'mod credentials;\nmod shell;\nmod storage;',
              'mod credentials;\n#[cfg(target_os = "windows")]\nmod fullscreen;\nmod shell;\nmod storage;',
              1,
          )
          init_line = '                .map_err(std::io::Error::other)?;\n            Ok(())'
          assert lib.count(init_line) == 1
          lib = lib.replace(
              init_line,
              '                .map_err(std::io::Error::other)?;\n            #[cfg(target_os = "windows")]\n            fullscreen::start(app.handle().clone()).map_err(std::io::Error::other)?;\n            Ok(())',
              1,
          )
          lib_path.write_text(lib, encoding='utf-8')
      - name: Commit source wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-fullscreen-shell.yml
          git add src-tauri/src/lib.rs src-tauri/src/shell.rs
          git commit -m "feat(desktop): wire fullscreen Orb suppression"
          git push origin HEAD:main
