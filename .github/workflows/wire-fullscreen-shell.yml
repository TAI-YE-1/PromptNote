name: wire-fullscreen-shell

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-fullscreen-shell.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --ignore-scripts
      - name: Wire fullscreen guard into the unique shell controller
        shell: pwsh
        run: |
          $shellPath = 'src-tauri/src/shell.rs'
          $shell = [System.IO.File]::ReadAllText($shellPath).Replace("`r`n", "`n")
          $oldShow = @(
            '    fn show_orb(&self, app: &AppHandle) -> Result<(), String> {',
            '        let orb = orb_window(app)?;',
            '        let preferences = self.lock_preferences()?.clone();',
            '        let monitor = select_monitor(&orb, preferences.monitor_name.as_deref())?;',
            '        self.position_orb(&orb, &monitor, false)?;',
            '        orb.show().map_err(error_message)?;',
            '        self.set_mode_and_persist(ShellMode::Orb)?;',
            '        self.emit_snapshot(app)',
            '    }'
          ) -join "`n"
          $newShow = @(
            '    fn show_orb(&self, app: &AppHandle) -> Result<(), String> {',
            '        let orb = orb_window(app)?;',
            '        self.set_mode_and_persist(ShellMode::Orb)?;',
            '        if crate::fullscreen::is_suppressed() {',
            '            hide_window(app, ORB_LABEL)?;',
            '            return self.emit_snapshot(app);',
            '        }',
            '        let preferences = self.lock_preferences()?.clone();',
            '        let monitor = select_monitor(&orb, preferences.monitor_name.as_deref())?;',
            '        self.position_orb(&orb, &monitor, false)?;',
            '        orb.show().map_err(error_message)?;',
            '        self.emit_snapshot(app)',
            '    }'
          ) -join "`n"
          if (-not $shell.Contains($oldShow)) { throw 'shell show_orb anchor changed' }
          $shell = $shell.Replace($oldShow, $newShow)
          [System.IO.File]::WriteAllText($shellPath, $shell, [System.Text.UTF8Encoding]::new($false))

          $libPath = 'src-tauri/src/lib.rs'
          $lib = [System.IO.File]::ReadAllText($libPath).Replace("`r`n", "`n")
          $moduleAnchor = "mod credentials;`nmod shell;`nmod storage;"
          $moduleReplacement = "mod credentials;`n#[cfg(target_os = `"windows`)]`nmod fullscreen;`nmod shell;`nmod storage;"
          if (-not $lib.Contains($moduleAnchor)) { throw 'lib module anchor changed' }
          $lib = $lib.Replace($moduleAnchor, $moduleReplacement)
          $setupAnchor = @(
            '            app.state::<ShellController>()',
            '                .initialize(app.handle())',
            '                .map_err(std::io::Error::other)?;',
            '            Ok(())'
          ) -join "`n"
          $setupReplacement = @(
            '            app.state::<ShellController>()',
            '                .initialize(app.handle())',
            '                .map_err(std::io::Error::other)?;',
            '            #[cfg(target_os = "windows")]',
            '            fullscreen::start(app.handle().clone()).map_err(std::io::Error::other)?;',
            '            Ok(())'
          ) -join "`n"
          $setupReplacement = $setupReplacement.Replace('\', '')
          if (-not $lib.Contains($setupAnchor)) { throw 'lib setup anchor changed' }
          $lib = $lib.Replace($setupAnchor, $setupReplacement)
          [System.IO.File]::WriteAllText($libPath, $lib, [System.Text.UTF8Encoding]::new($false))
      - name: Build real Desktop frontendDist
        shell: pwsh
        run: npm run build:desktop-shell
      - name: Regenerate locked Windows dependency graph
        shell: pwsh
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Test Windows x64 Desktop host
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Commit validated fullscreen guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wire-fullscreen-shell.yml
          git add src-tauri/src/lib.rs src-tauri/src/shell.rs src-tauri/Cargo.lock
          git commit -m "feat(desktop): hide Orb for external fullscreen"
          git push origin HEAD:main
