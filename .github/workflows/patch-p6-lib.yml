name: patch-p6-lib

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-p6-lib.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch Tauri host runtime
        shell: python
        run: |
          from pathlib import Path
          p=Path('src-tauri/src/lib.rs')
          s=p.read_text()
          s=s.replace('mod shell;\nmod storage;','mod shell;\nmod startup;\nmod storage;',1)
          s=s.replace('use shell::{ShellController, ShellSnapshot};\nuse storage::PromptDocument;','use shell::{ShellController, ShellSnapshot};\nuse startup::{StartupSnapshot, StartupState};\nuse storage::PromptDocument;',1)
          run='# [cfg_attr(mobile, tauri::mobile_entry_point)]'.replace('# ','#')+'\npub fn run() {'
          commands='\n'.join([
              '#[tauri::command]',
              "fn startup_snapshot(app: tauri::AppHandle, state: tauri::State<'_, StartupState>) -> Result<StartupSnapshot, String> {",
              '    startup::snapshot(&app, &state)',
              '}',
              '',
              '#[tauri::command]',
              'fn startup_set_autostart(app: tauri::AppHandle, enabled: bool) -> Result<bool, String> {',
              '    startup::set_autostart(&app, enabled)',
              '}',
              '',
              '',
          ])
          assert run in s
          s=s.replace(run,commands+run,1)
          anchor='        .plugin(tauri_plugin_http::init())\n        .setup(|app| {'
          plugins='\n'.join([
              '        .plugin(',
              '            tauri_plugin_global_shortcut::Builder::new()',
              '                .with_handler(|app, shortcut, event| {',
              '                    if event.state() == tauri_plugin_global_shortcut::ShortcutState::Pressed',
              '                        && shortcut == &startup::promptnote_shortcut()',
              '                    {',
              '                        if let Some(shell) = app.try_state::<ShellController>() {',
              '                            if let Err(error) = shell.toggle_compact(app) {',
              '                                eprintln!("PromptNote global shortcut failed: {error}");',
              '                            }',
              '                        }',
              '                    }',
              '                })',
              '                .build(),',
              '        )',
              '        .plugin(tauri_plugin_autostart::init(',
              '            tauri_plugin_autostart::MacosLauncher::LaunchAgent,',
              '            Some(vec![startup::AUTOSTART_ARG]),',
              '        ))',
              '        .plugin(tauri_plugin_http::init())',
              '        .setup(|app| {',
          ])
          assert anchor in s
          s=s.replace(anchor,plugins,1)
          a=s.index('            app.manage(shell);')
          b=s.index('            #[cfg(target_os = "windows")]',a)
          manage='\n'.join([
              '            app.manage(shell);',
              '            let startup_state = startup::register_global_shortcut(app.handle());',
              '            app.manage(startup_state);',
              '            let background_launch = startup::launched_from_autostart();',
              '            app.state::<ShellController>()',
              '                .initialize(app.handle(), background_launch)',
              '                .map_err(std::io::Error::other)?;',
              '',
          ])
          s=s[:a]+manage+s[b:]
          anchor='            shell_set_orb_idle,\n        ])'
          assert anchor in s
          s=s.replace(anchor,'            shell_set_orb_idle,\n            startup_snapshot,\n            startup_set_autostart,\n        ])',1)
          p.write_text(s)
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-p6-lib.yml
          git add src-tauri/src/lib.rs
          git commit -m "feat(desktop): wire shortcut and autostart host"
          git push
