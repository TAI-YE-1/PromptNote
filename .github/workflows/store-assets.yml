name: store-assets

on:
  push:
    paths:
      - 'docs/store-assets/store-screenshots-render.html'
      - 'docs/store-assets/icon-300.png'
      - '.github/workflows/store-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CJK fonts and locale
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk locales
          sudo locale-gen zh_CN.UTF-8
          fc-cache -f
          fc-match 'Noto Sans CJK SC'

      - name: Force deterministic CJK font in store source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/store-assets/store-screenshots-render.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              ':root{font-family:Inter,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;',
              ':root{font-family:"Noto Sans CJK SC",Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;'
          )
          text = text.replace(
              'font:11px/1.62 ui-monospace,SFMono-Regular,Consolas,monospace;',
              'font:11px/1.62 "Noto Sans CJK SC",ui-monospace,SFMono-Regular,Consolas,monospace;'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not found on runner.' >&2
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"

      - name: Verify Chrome rasterizes distinct CJK glyphs
        shell: bash
        env:
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
        run: |
          set -euo pipefail
          cat > /tmp/promptnote-cjk-probe.html <<'EOF'
          <!doctype html><meta charset="utf-8"><body><script>
          const canvas = document.createElement('canvas');
          canvas.width = 72; canvas.height = 72;
          const ctx = canvas.getContext('2d', {willReadFrequently: true});
          ctx.fillStyle = '#000';
          ctx.textBaseline = 'alphabetic';
          ctx.font = '48px "Noto Sans CJK SC"';
          const chars = [...'中文测试目标背景任务约束复制预览'];
          const hashes = [];
          for (const ch of chars) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillText(ch, 8, 56);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let h = 2166136261 >>> 0;
            for (let i = 3; i < data.length; i += 4) {
              h ^= data[i];
              h = Math.imul(h, 16777619) >>> 0;
            }
            hashes.push(h.toString(16));
          }
          const unique = new Set(hashes).size;
          document.body.dataset.fontLoaded = document.fonts.check('48px "Noto Sans CJK SC"', '中文测试') ? 'yes' : 'no';
          document.body.dataset.uniqueGlyphs = String(unique);
          document.body.dataset.glyphCheck = unique >= 8 ? 'ok' : 'failed';
          document.body.textContent = `fontLoaded=${document.body.dataset.fontLoaded} uniqueGlyphs=${unique} glyphCheck=${document.body.dataset.glyphCheck}`;
          </script></body>
          EOF
          CHROME='${{ steps.chrome.outputs.path }}'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --lang=zh-CN \
            --dump-dom file:///tmp/promptnote-cjk-probe.html | tee /tmp/promptnote-cjk-probe.txt
          grep 'glyphCheck=ok' /tmp/promptnote-cjk-probe.txt
          grep -E 'fontLoaded=(yes|no)' /tmp/promptnote-cjk-probe.txt

      - name: Render 1280x800 Edge store screenshots
        shell: bash
        env:
          LANG: zh_CN.UTF-8
          LC_ALL: zh_CN.UTF-8
        run: |
          set -euo pipefail
          mkdir -p docs/store-assets/screenshots
          PAGE="file://$GITHUB_WORKSPACE/docs/store-assets/store-screenshots-render.html"
          CHROME='${{ steps.chrome.outputs.path }}'
          while read -r screen file; do
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --lang=zh-CN \
              --force-device-scale-factor=1 \
              --window-size=1280,800 \
              --screenshot="$GITHUB_WORKSPACE/docs/store-assets/screenshots/$file" \
              "$PAGE?screen=$screen"
          done <<'EOF'
          editor screenshot-01-editor.png
          slash screenshot-02-slash-menu.png
          ai screenshot-03-ai-assist.png
          preview screenshot-04-preview-copy.png
          EOF

      - name: Validate screenshot files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          root = Path('docs/store-assets/screenshots')
          names = [
              'screenshot-01-editor.png',
              'screenshot-02-slash-menu.png',
              'screenshot-03-ai-assist.png',
              'screenshot-04-preview-copy.png',
          ]
          for name in names:
              path = root / name
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: not a PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != (1280, 800):
                  raise SystemExit(f'{name}: expected 1280x800, got {width}x{height}')
              print(f'{name}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit rendered screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/store-assets/screenshots/*.png
          if git diff --cached --quiet; then
            echo 'Store screenshots are already up to date.'
            exit 0
          fi
          git commit -m 'docs(store): render Edge screenshots'
          git push
