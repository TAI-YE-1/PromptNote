<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PromptNote / 提词笺 — P0.5 Prototype</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#20242a;--muted:#747b85;--line:#e6e8ec;--soft:#f7f8fa;--blue:#2f6feb;--blue2:#edf4ff;--warn:#9a5b00;--warn2:#fff6e5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}
.shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.controls{padding:20px 16px;background:#fbfbfc;border-right:1px solid var(--line)}.badge{display:inline-block;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:11px}.controls h1{font-size:20px;margin:13px 0 5px}.controls p{font-size:12px;line-height:1.55;color:var(--muted)}.group{margin:18px 0}.label{font-size:10px;font-weight:800;letter-spacing:.09em;color:#9198a2;margin-bottom:7px;text-transform:uppercase}.row{display:flex;flex-wrap:wrap;gap:6px}.ctl,.btn,.icon,.tab,.menu button,.ghost,.primary{border:1px solid var(--line);background:#fff;border-radius:8px}.ctl{font-size:11px;padding:7px 8px}.ctl:hover,.btn:hover,.icon:hover,.tab:hover,.ghost:hover,.menu button:hover{background:#f1f3f6}.ctl.on{border-color:#a8c5ff;background:var(--blue2);color:#1c5fc9}.toggle{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:9px 0}.sw{width:36px;height:21px;border-radius:20px;background:#c9ced5;padding:3px}.sw:after{content:"";display:block;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:#3972d1}.sw.on:after{transform:translateX(15px)}
.stage{display:grid;place-items:center;padding:28px;overflow:auto}.context{width:min(1080px,100%);display:grid;grid-template-columns:1fr auto;gap:16px}.fake{min-width:360px;min-height:740px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:24px}.fake h2{margin:10px 0 8px;font-size:22px}.fake p{color:var(--muted);line-height:1.6;font-size:13px}.chat{margin-top:62px;min-height:450px;border:1px solid var(--line);border-radius:16px;background:#fcfcfd;padding:15px;display:flex;flex-direction:column;justify-content:flex-end}.bubble{align-self:flex-end;background:#f0f2f5;padding:10px 12px;border-radius:16px;font-size:12px}.fakeinput{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;color:#999;font-size:12px;min-height:66px}.fakeinput.has{background:#fffdf6;border-color:#e7d3a3;color:#555}
.wrap{width:440px;transition:.15s}.panel{width:100%;height:740px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 18px 50px rgba(22,27,34,.14);overflow:hidden;position:relative;display:flex;flex-direction:column}.top{height:52px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:34px 1fr 34px;align-items:center;padding:0 9px;gap:6px}.icon{width:34px;height:34px;border-color:transparent;background:transparent}.title{border:0;outline:0;width:100%;font-weight:650;background:transparent;font-size:14px}.view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}.editor{flex:1;min-height:0;overflow:auto;padding:18px 17px 88px;position:relative}.empty{padding:65px 8px;color:var(--muted)}.empty strong{display:block;color:#4c525a;font-size:15px;margin-bottom:7px}.empty .row{margin-top:14px}.btn{padding:8px 9px;font-size:11px}
.block{padding:4px 0 10px 12px;border-left:2px solid transparent;margin:2px 0 8px}.block.sec{border-left-color:#d8e5ff}.blabel{font-size:10px;color:#64758d;font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between}.bmore{opacity:0;border:0;background:transparent;color:#999}.block:hover .bmore,.block:focus-within .bmore{opacity:1}.body{outline:0;min-height:24px;font-size:14px;line-height:1.65;white-space:pre-wrap}.body:empty:before{content:attr(data-ph);color:#b0b5bc}.adder{display:flex;gap:7px;align-items:center;color:#999;font-size:11px}.adder button{width:25px;height:25px}
.slash{position:absolute;z-index:30;left:20px;top:80px;width:min(295px,calc(100% - 40px));max-height:410px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(22,27,34,.16);padding:7px}.mhead{font-size:9px;font-weight:800;color:#9aa1aa;letter-spacing:.09em;padding:7px 7px 4px}.menu button{width:100%;display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;padding:7px;border-color:transparent;margin:2px 0}.mi{width:27px;height:27px;display:grid;place-items:center;background:var(--soft);border-radius:7px;color:#68717b}.menu b{font-size:12px;display:block}.menu small{color:var(--muted);font-size:10px}
.selbar{position:absolute;z-index:40;display:flex;gap:3px;align-items:center;background:#20242a;color:#fff;padding:5px;border-radius:9px;transform:translate(-50%,-100%);box-shadow:0 8px 24px rgba(0,0,0,.25)}.selbar button{border:0;background:transparent;color:#fff;border-radius:6px;padding:6px 7px;font-size:10px}.selbar button:hover{background:#ffffff18}.sep{width:1px;height:17px;background:#ffffff2b}
.card{margin:12px 0;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fbfcff}.card.stale{background:var(--warn2);border-color:#e8d2a7}.eyebrow{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:#5b6b83}.stale{font-size:9px;color:var(--warn)}.cmp-l{font-size:9px;color:#999;margin:8px 0 3px}.cmp{font-size:12px;line-height:1.5;border:1px solid #eceef2;background:#fff;border-radius:8px;padding:8px}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:9px}.ghost,.primary{padding:7px 9px;font-size:11px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.primary:disabled{opacity:.45}.lint{background:#fffefa}.finding{display:grid;grid-template-columns:18px 1fr auto;gap:6px;padding:8px 0;border-top:1px solid #eee8da;font-size:11px}.finding:first-of-type{border-top:0}.finding small{display:block;color:var(--muted);margin-top:2px}.bottom{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr 1.1fr 1.2fr;gap:6px;padding:9px;border-top:1px solid var(--line);background:#ffffffef;backdrop-filter:blur(8px)}.bottom .btn{white-space:nowrap}.bottom .primary{font-size:11px}
.previewhead{height:52px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:34px 1fr 34px;align-items:center;padding:0 9px}.ptitle{text-align:center;font-size:13px;font-weight:700}.previewbody{flex:1;overflow:auto;padding:14px 14px 82px}.tabs{display:flex;background:var(--soft);padding:4px;border-radius:9px;gap:4px}.tab{flex:1;border-color:transparent;background:transparent;padding:7px;font-size:11px}.tab.on{background:#fff;border-color:var(--line)}pre{white-space:pre-wrap;overflow-wrap:anywhere;min-height:430px;background:#fbfbfc;border:1px solid var(--line);border-radius:11px;padding:12px;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.pactions{position:absolute;bottom:0;left:0;right:0;display:flex;gap:7px;padding:9px;border-top:1px solid var(--line);background:#fff}.pactions button{flex:1}
.overlay{position:absolute;inset:0;z-index:60;background:#161b2250;display:flex;align-items:flex-end}.sheet{width:100%;max-height:78%;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:13px}.sheethead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}.search{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:9px;margin:9px 0;outline:0}.doc{width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:8px}.doc:hover,.doc.on{background:var(--blue2)}.modalbg{position:absolute;inset:0;z-index:70;background:#161b2255;display:grid;place-items:center;padding:16px}.modal{width:min(320px,100%);background:#fff;border-radius:14px;padding:15px}.modal h3{font-size:14px;margin:0 0 6px}.modal p{font-size:11px;color:var(--muted);line-height:1.5}.radio{display:block;padding:7px 0;font-size:12px}.toast{position:absolute;z-index:90;left:50%;bottom:68px;transform:translateX(-50%);background:#20242a;color:#fff;border-radius:8px;padding:8px 11px;font-size:11px;white-space:nowrap}
@media(max-width:960px){.shell{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid var(--line)}.context{grid-template-columns:1fr}.fake{display:none}}@media(max-width:560px){.stage{padding:8px}.wrap{max-width:100%}}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{"use strict";
const meta={goal:["目标","◎","你希望 AI 最终完成什么"],context:["背景","▣","必要上下文与当前状态"],instruction:["任务","→","需要执行的具体动作"],constraint:["约束","⛓","不能做什么、必须遵守什么"],example:["示例","◇","输入、输出或参考样例"],output:["输出格式","↳","希望结果如何呈现"],acceptance:["验收标准","✓","什么情况下算完成"],paragraph:["普通段落","¶","自由文本"]};
const baseDocs={a:{id:"a",title:"修复权限问题",blocks:[["goal","修复 owner 权限判断错误，让 owner 可以正常撤销和分配角色。"],["context","当前飞书端会提示 owner 没有权限管理角色，但此前这条能力已经修复过，怀疑新逻辑又走回了 admin-only 判断。"],["constraint","先检查真实代码和当前调用链，不要先改。尽量只处理这个问题，不扩大修改范围。"],["acceptance","owner 可以撤销 owner/operator/frontdesk；admin 原有能力不回退；其它角色权限不受影响。"]].map((x,i)=>({id:"a"+i,kind:x[0],content:x[1]}))},b:{id:"b",title:"S15 数据规则",blocks:[{id:"b1",kind:"goal",content:"梳理 S15 的销售基线数据使用规则。"},{id:"b2",kind:"constraint",content:"只处理算法和数据使用，不改现有架构。"}]},c:{id:"c",title:"新建酒店流程",blocks:[{id:"c1",kind:"context",content:"所有酒店业务表结构一致，仅数据库名不同。"},{id:"c2",kind:"instruction",content:"设计新建酒店时同时绑定数据库和读写账号的最小流程。"}]}};
const clone=o=>JSON.parse(JSON.stringify(o)),init=()=>({w:440,view:"edit",id:"a",docs:clone(baseDocs),rev:1,slash:false,sug:null,stale:false,lint:false,fmt:"plain",docsOpen:false,search:"",sel:null,pos:{x:220,y:220},adapter:true,target:false,dialog:null,choice:"append",toast:null});
let s=init(),timer;const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"),doc=()=>s.docs[s.id];
function toast(t){s.toast=t;clearTimeout(timer);render();timer=setTimeout(()=>{s.toast=null;render()},1500)}
function compile(f=s.fmt){if(f==="plain")return doc().blocks.map(b=>b.kind==="paragraph"?b.content:`${meta[b.kind][0]}\n${b.content}`).join("\n\n");if(f==="markdown")return doc().blocks.map(b=>b.kind==="paragraph"?b.content:`## ${meta[b.kind][0]}\n\n${b.content}`).join("\n\n");const x=t=>String(t).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");return"<prompt>\n"+doc().blocks.map(b=>`  <${b.kind}>${x(b.content)}</${b.kind}>`).join("\n")+"\n</prompt>"}
function jump(x){if(x==="empty"){const id="empty";s.docs[id]={id,title:"未命名 Prompt",blocks:[]};s.id=id;s.view="edit";s.slash=false;s.sug=null;s.lint=false}else if(x==="structured"){s.id="a";s.view="edit";s.slash=false;s.sug=null;s.lint=false}else if(x==="slash"){s.id="a";s.view="edit";s.slash=true;s.sug=null;s.lint=false}else if(x==="suggestion"){s.id="a";s.view="edit";s.sel={blockId:"a2",text:"尽量只处理这个问题，不扩大修改范围。"};s.sug=mkSug("clarify");s.stale=false}else if(x==="lint"){s.id="a";s.view="edit";s.lint=true;s.sug=null}else if(x==="preview"){s.id="a";s.view="preview";s.fmt="markdown"}else if(x==="fail"){s.id="a";s.view="edit";s.adapter=false;s.dialog="fail"}render()}
function mkSug(a){const src=s.sel?.text||"不要乱改其他地方";return{a,blockId:s.sel?.blockId,src,text:a==="shorten"?"仅处理本问题，不扩大修改范围。":a==="split"?"• 仅修改与本问题直接相关的代码。\n• 不扩大修改范围。\n• 不改变其它角色已有权限。":"仅修改与本问题直接相关的代码；不得扩大修改范围。",rev:s.rev}}
function controls(){return`<aside class="controls"><span class="badge">Prototype Controls · P0.5</span><h1>PromptNote / 提词笺</h1><p>这些控制项只用于验收，不属于正式产品。</p><div class="group"><div class="label">快速状态</div><div class="row">${[["empty","空状态"],["structured","结构化"],["slash","Slash"],["suggestion","AI 建议"],["lint","检查"],["preview","预览"],["fail","插入失败"]].map(x=>`<button class="ctl" data-jump="${x[0]}">${x[1]}</button>`).join("")}</div></div><div class="group"><div class="label">Side Panel 宽度</div><div class="row">${[360,440,520].map(w=>`<button class="ctl ${s.w===w?"on":""}" data-w="${w}">${w}px</button>`).join("")}</div></div><div class="group"><div class="label">插入环境</div><div class="toggle"><span>Adapter 可用</span><span class="sw ${s.adapter?"on":""}" data-toggle="adapter"></span></div><div class="toggle"><span>输入框已有内容</span><span class="sw ${s.target?"on":""}" data-toggle="target"></span></div></div><button class="ctl" data-act="reset">重置演示</button><p>主链：自然书写 → / → 结构化 → 选择文字 → AI 建议 → 检查 → Preview → Insert。</p></aside>`}
function fake(){return`<section class="fake"><span class="badge">当前 AI 网页 · 模拟</span><h2>旁边就是你正在使用的 AI</h2><p>P0.5 不操作真实网页 DOM，只模拟 Adapter 和输入冲突状态。</p><div class="chat"><div class="bubble">帮我检查一下这个权限问题。</div><div class="fakeinput ${s.target?"has":""}">${s.target?"这里已经有一段尚未发送的文字……":"发送消息…"}</div></div></section>`}
function blocks(){if(!doc().blocks.length)return`<div class="empty"><strong>开始写你的 Prompt…</strong><div>直接输入自然语言即可。输入 <b>/</b> 可以添加目标、背景、约束等结构。</div><div class="row"><button class="btn" data-act="start">直接开始写</button><button class="btn" data-act="slash">/ 添加结构</button></div></div>`;return doc().blocks.map(b=>`<article class="block ${b.kind!=="paragraph"?"sec":""}">${b.kind!=="paragraph"?`<div class="blabel"><span>${meta[b.kind][0]}</span><button class="bmore" data-act="togglekind" data-id="${b.id}">···</button></div>`:""}<div class="body" contenteditable="true" spellcheck="false" data-id="${b.id}" data-ph="继续输入…">${esc(b.content).replaceAll("\n","<br>")}</div></article>`).join("")+`<div class="adder"><button class="btn" data-act="slash">/</button><span>添加结构，或直接继续写</span></div>`}
function slash(){const kinds=["goal","context","instruction","constraint","example","output","acceptance"];return`<div class="slash menu"><div class="mhead">PROMPT 结构</div>${kinds.map(k=>`<button data-kind="${k}"><span class="mi">${meta[k][1]}</span><span><b>${meta[k][0]}</b><small>${meta[k][2]}</small></span></button>`).join("")}<div class="mhead">基础块</div><button data-kind="paragraph"><span class="mi">¶</span><span><b>普通段落</b><small>继续自由书写</small></span></button></div>`}
function selbar(){const x=Math.max(115,Math.min(s.w-115,s.pos.x)),y=Math.max(95,s.pos.y);return`<div class="selbar" style="left:${x}px;top:${y}px"><button data-ai="bold">B</button><button data-ai="italic"><i>I</i></button><span class="sep"></span><button data-ai="clarify">改清楚</button><button data-ai="shorten">缩短</button><button data-ai="split">拆成约束</button></div>`}
function sug(){return`<section class="card ${s.stale?"stale":""}"><div class="eyebrow"><span>AI 建议</span>${s.stale?`<span class="stale">正文已变化 · 建议可能过期</span>`:""}</div><div class="cmp-l">原文</div><div class="cmp">${esc(s.sug.src)}</div><div class="cmp-l">建议</div><div class="cmp">${esc(s.sug.text).replaceAll("\n","<br>")}</div><div class="actions"><button class="ghost" data-act="ignore">忽略</button><button class="primary" data-act="accept" ${s.stale?"disabled":""}>接受</button></div></section>`}
function findings(){const t=doc().blocks.map(b=>b.content).join("\n"),f=[];if(t.includes("尽量"))f.push(["⚠","“尽量”表达比较模糊","可以改成更明确的约束。","定位原文","fuzzy"]);if(!doc().blocks.some(b=>b.kind==="acceptance"))f.push(["⚠","当前没有明确验收标准","建议补充“什么情况下算完成”。","添加验收标准","acceptance"]);if(doc().blocks.length<3)f.push(["○","内容结构较弱","可以逐步增加目标、约束或验收标准。","打开结构菜单","slash"]);return f.length?f:[["✓","没有发现明显结构问题","这里不提供 Prompt 分数。","",""]]}
function lint(){const f=findings();return`<section class="card lint"><div class="eyebrow">检查到 ${f.filter(x=>x[0]!=="✓").length} 个可能问题</div>${f.map(x=>`<div class="finding"><span>${x[0]}</span><div>${x[1]}<small>${x[2]}</small></div>${x[3]?`<button class="ghost" data-lint="${x[4]}">${x[3]}</button>`:""}</div>`).join("")}</section>`}
function editor(){return`<header class="top"><button class="icon" data-act="docs">☰</button><input class="title" data-title value="${esc(doc().title)}"><button class="icon" data-act="noop">···</button></header><div class="view"><div class="editor">${blocks()}${s.sug?sug():""}${s.lint?lint():""}${s.slash?slash():""}${s.sel?selbar():""}</div><div class="bottom"><button class="btn" data-act="check">检查</button><button class="btn" data-act="preview">预览</button><button class="btn" data-act="copy">复制 ▾</button><button class="primary" data-act="insert">插入</button></div></div>`}
function preview(){return`<div class="view"><header class="previewhead"><button class="icon" data-act="back">←</button><div class="ptitle">Prompt Preview</div><span></span></header><div class="previewbody"><div class="tabs">${[["plain","Plain"],["markdown","Markdown"],["xml","XML"]].map(x=>`<button class="tab ${s.fmt===x[0]?"on":""}" data-fmt="${x[0]}">${x[1]}</button>`).join("")}</div><pre>${esc(compile())}</pre></div><div class="pactions"><button class="btn" data-act="copy">复制</button><button class="primary" data-act="insert">插入</button></div></div>`}
function docs(){const q=s.search.toLowerCase(),arr=Object.values(s.docs).filter(d=>d.title.toLowerCase().includes(q));return`<div class="overlay"><div class="sheet"><div class="sheethead"><span>Prompt</span><button class="icon" data-act="closedocs">×</button></div><input class="search" data-search placeholder="搜索…" value="${esc(s.search)}">${arr.map(d=>`<button class="doc ${d.id===s.id?"on":""}" data-doc="${d.id}">${esc(d.title)}</button>`).join("")}<button class="doc" data-act="new">＋ 新建 Prompt</button></div></div>`}
function dialog(){if(s.dialog==="fail")return`<div class="modalbg"><div class="modal"><h3>无法插入到当前页面</h3><p>你的 Prompt 没有丢失。当前 Adapter 不可用时仍可以复制。</p><div class="actions"><button class="ghost" data-act="close">取消</button><button class="primary" data-act="copyclose">复制到剪贴板</button></div></div></div>`;return`<div class="modalbg"><div class="modal"><h3>当前输入框已有内容</h3><p>PromptNote 不会静默覆盖。</p>${[["append","追加到现有内容后"],["replace","替换现有内容"],["cancel","取消"]].map(x=>`<label class="radio"><input type="radio" name="choice" value="${x[0]}" ${s.choice===x[0]?"checked":""}> ${x[1]}</label>`).join("")}<div class="actions"><button class="ghost" data-act="close">返回</button><button class="primary" data-act="confirm">继续</button></div></div></div>`}
function render(){app.innerHTML=`<div class="shell">${controls()}<main class="stage"><div class="context">${fake()}<div><div class="wrap" style="width:${s.w}px"><section class="panel">${s.view==="edit"?editor():preview()}${s.docsOpen?docs():""}${s.dialog?dialog():""}${s.toast?`<div class="toast">${esc(s.toast)}</div>`:""}</section></div><p style="text-align:center;color:#888;font-size:10px">${s.w}px Side Panel 模拟</p></div></div></main></div>`;bind()}
function add(kind){doc().blocks.push({id:"x"+Date.now(),kind,content:""});s.rev++;s.slash=false;s.sel=null;render();setTimeout(()=>{const a=$$(".body").at(-1);a?.focus()},0)}
function copy(){const text=compile(),ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();toast("已复制（原型）")}
function insert(){if(!s.adapter){s.dialog="fail";render()}else if(s.target){s.dialog="conflict";s.choice="append";render()}else toast("模拟插入成功 · 不会自动发送")}
function accept(){if(!s.sug||s.stale)return;const b=doc().blocks.find(x=>x.id===s.sug.blockId);if(b){if(s.sug.a==="split"){b.kind="constraint";b.content=s.sug.text}else b.content=b.content.includes(s.sug.src)?b.content.replace(s.sug.src,s.sug.text):s.sug.text;s.rev++}s.sug=null;s.sel=null;s.stale=false;render();toast("已接受建议")}
function choose(){const q=window.getSelection();if(!q||q.isCollapsed||!q.toString().trim()){s.sel=null;render();return}const el=q.anchorNode?.parentElement?.closest?.(".body");if(!el)return;const r=q.getRangeAt(0).getBoundingClientRect(),p=$(".panel").getBoundingClientRect();s.sel={blockId:el.dataset.id,text:q.toString().trim()};s.pos={x:r.left-p.left+r.width/2,y:r.top-p.top-4};render()}
function bind(){
$$('[data-jump]').forEach(e=>e.onclick=()=>jump(e.dataset.jump));$$('[data-w]').forEach(e=>e.onclick=()=>{s.w=+e.dataset.w;render()});$$('[data-toggle]').forEach(e=>e.onclick=()=>{s[e.dataset.toggle==='adapter'?'adapter':'target']=!s[e.dataset.toggle==='adapter'?'adapter':'target'];render()});
$$('[data-act]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const a=e.dataset.act;if(a==='reset'){s=init();render()}else if(a==='start')add('paragraph');else if(a==='slash'){s.slash=true;s.sel=null;render()}else if(a==='docs'){s.docsOpen=true;render()}else if(a==='closedocs'){s.docsOpen=false;render()}else if(a==='new'){const id='d'+Date.now();s.docs[id]={id,title:'未命名 Prompt',blocks:[]};s.id=id;s.docsOpen=false;render()}else if(a==='togglekind'){const b=doc().blocks.find(x=>x.id===e.dataset.id);b.kind=b.kind==='paragraph'?'constraint':'paragraph';s.rev++;render()}else if(a==='ignore'){s.sug=null;s.sel=null;render()}else if(a==='accept')accept();else if(a==='check'){s.lint=!s.lint;s.sug=null;s.sel=null;render()}else if(a==='preview'){s.view='preview';s.fmt='plain';render()}else if(a==='back'){s.view='edit';render()}else if(a==='copy')copy();else if(a==='insert')insert();else if(a==='close'){s.dialog=null;render()}else if(a==='copyclose'){s.dialog=null;copy()}else if(a==='confirm'){if(s.choice==='cancel'){s.dialog=null;render()}else{s.dialog=null;toast(s.choice==='replace'?'模拟：已替换输入框':'模拟：已追加到输入框')}}});
$$('[data-kind]').forEach(e=>e.onclick=()=>add(e.dataset.kind));$$('[data-ai]').forEach(e=>e.onclick=()=>{const a=e.dataset.ai;if(a==='bold'||a==='italic'){toast('原型不实现正式富文本命令');return}if(!s.sel)return;s.sug=mkSug(a);s.stale=false;s.sel=null;render()});
$$('.body').forEach(e=>{e.oninput=()=>{const b=doc().blocks.find(x=>x.id===e.dataset.id),v=e.innerText.replace(/\n+$/,'');if(b.content!==v){b.content=v;s.rev++;if(s.sug&&s.sug.blockId===b.id)s.stale=s.rev!==s.sug.rev}};e.onkeydown=ev=>{if(ev.key==='/'){ev.preventDefault();s.slash=true;render()}};e.onmouseup=()=>setTimeout(choose,0)});
$$('[data-fmt]').forEach(e=>e.onclick=()=>{s.fmt=e.dataset.fmt;render()});$$('[data-doc]').forEach(e=>e.onclick=()=>{s.id=e.dataset.doc;s.docsOpen=false;s.view='edit';s.sug=null;s.lint=false;render()});$('[data-title]')?.addEventListener('input',e=>doc().title=e.target.value);$('[data-search]')?.addEventListener('input',e=>{s.search=e.target.value;render();setTimeout(()=>{const z=$('[data-search]');z?.focus();z?.setSelectionRange(s.search.length,s.search.length)},0)});$$('input[name="choice"]').forEach(e=>e.onchange=()=>s.choice=e.value);
$$('[data-lint]').forEach(e=>e.onclick=()=>{if(e.dataset.lint==='acceptance'){s.lint=false;add('acceptance')}else if(e.dataset.lint==='slash'){s.lint=false;s.slash=true;render()}else toast('已定位到包含“尽量”的原文')});
}
render()})();
</script></body></html>
